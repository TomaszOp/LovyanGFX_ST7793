[platformio]
default_envs = esp32-c3-devkitm-1

; LovyanGFX (with Panel_ST7793) is the local copy in lib/LovyanGFX.
; Pin configurations: lib/LovyanGFX/src/lgfx_user/LGFX_ESP32*_ST7793.hpp

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
monitor_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; ---- Arduino core 2.x (ESP-IDF 4.4), official PlatformIO platform ------------
; WARNING: espressif32@6.x and the default espressif32 (pioarduino, Arduino 3.x)
; install framework-arduinoespressif32 / tool-esptoolpy / toolchain-riscv32-esp
; under the same names in ~/.platformio/packages. Building an *-arduino2 env
; replaces the Arduino 3.x packages (and vice versa), so every switch between
; the two re-downloads them.

[env:esp32-s3-devkitc-1-arduino2]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

[env:esp32-c3-devkitm-1-arduino2]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
monitor_speed = 115200

[env:esp32dev-arduino2]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
